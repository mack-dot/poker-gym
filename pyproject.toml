[project]
name = "pokergym"
version = "0.1.0"
description = "Poker Gym: fast, verified eight-player poker tournament simulator for No Limit rehearsal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pokerkit==0.7.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pokergym*"]

[tool.setuptools.package-data]
pokergym = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running exhaustive checks"]
addopts = "-q"
