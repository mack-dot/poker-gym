[project]
name = "pokergym"
version = "0.1.0"
description = "Poker Gym: unofficial practice simulator for eight-player No Limit tournament rehearsal"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Mack Ianni" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pokerkit==0.7.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pokergym*"]

[tool.setuptools.package-data]
pokergym = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running exhaustive checks"]
addopts = "-q"
